<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 512 512" role="img" aria-label="Zero One">
  <!--
    The vendor mark: the Zero One tile (zerONE brand, the owner's decision of
    2026-10-15 - «خليها ايقونه ابداعاتك», make it an icon). It is what a site shows
    wherever the tenant has set no mark of their own; anything attached under
    Theme Settings -> Branding, or Website Settings, still wins.

    ONE FILE, EVERY USE: the browser-tab favicon, the desk splash, the sign-in
    logo, and the sidebar's brand tile (with the page head's pill, the start
    pill, the dock chip and the bill's seal, which draw that same tile through
    `frappe.boot.bnd_logo`). Never a second copy: a mark that drifts between the
    tab and the pane is the same-fact-in-two-places trap with a picture on it.
    `context.VENDOR_MARK` names this path once; boot and the auth pages read it.
    A NEW FILENAME, not a repaint of `bunood-mark.svg`, so a browser's cached
    favicon cannot outlive the brand.

    THE TILE IS PART OF THE DRAWING. The rounded blue square is the icon, so the
    stylesheet must not box it again: the desk's tiles hold it as an image with
    no fill of their own (`_sidebar.scss`, `_dock.scss`, `_sales_bill.scss`).

    THE COLOURS ARE THE IDENTITY'S LITERAL COLOURS, NOT THE TENANT PALETTE: the
    blue tile, the white Z1, and the green of the flag and the orbit dot. They do
    not follow a tenant's seed and must not - a vendor mark is the vendor's. The
    "tokens, never raw hex" rule governs RULES in a stylesheet; this is an image
    asset, outside the palette derivation and outside the contrast gate, and a
    favicon is fetched with no site context, so there is no token to read here
    even in principle. The shipped palette ("Zero One", presets.PALETTES) is
    seeded with this tile's #1d55c0, but a tenant's own seed never repaints it.

    WHY PATHS AND NOT `<text>`: an SVG favicon is rasterised by the browser with
    no guarantee about available fonts, and a splash renders before any webfont
    has loaded. Frappe's and erpnext's own marks are paths for the same reason;
    this one sits beside them in a tab strip.

    `width`/`height` 100 keep the old mark's intrinsic size for the surfaces that
    size an <img> by its file (the splash); the drawing itself is the 512 grid.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3f8ced"/>
      <stop offset=".55" stop-color="#1d55c0"/>
      <stop offset="1" stop-color="#0d2a68"/>
    </linearGradient>
    <radialGradient id="gl" cx="120" cy="70" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wt" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4eefc"/>
    </linearGradient>
    <linearGradient id="wn" x1="17" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9fbbe9"/>
      <stop offset="1" stop-color="#c3d5f3"/>
    </linearGradient>
    <linearGradient id="wd" x1="111" y1="285" x2="188" y2="343" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cddcf5"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf2fd"/>
    </linearGradient>
    <linearGradient id="wb" x1="10" y1="0" x2="447" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b8cbee"/>
      <stop offset=".45" stop-color="#e3ecfb"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="ws" x1="0" y1="3" x2="0" y2="457" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d3e1f7"/>
    </linearGradient>
    <linearGradient id="gf" x1="605" y1="3" x2="420" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c9f0a4"/>
      <stop offset=".5" stop-color="#6cc485"/>
      <stop offset="1" stop-color="#2f9463"/>
    </linearGradient>
    <linearGradient id="or" x1="100" y1="0" x2="740" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#d9f3e6" stop-opacity=".75"/>
      <stop offset="1" stop-color="#8fe0b8"/>
    </linearGradient>
    <radialGradient id="dt" cx=".36" cy=".32" r=".7">
      <stop offset="0" stop-color="#d4f7e4"/>
      <stop offset=".5" stop-color="#4cc68f"/>
      <stop offset="1" stop-color="#1f7f57"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#gl)"/>
  <g transform="translate(62 136) scale(.52)">
    <rect x="10" y="365" width="437" height="92" rx="26" fill="url(#wb)"/>
    <path d="M40 95H262L222 148H40Q17 148 17 121.5Q17 95 40 95Z" fill="url(#wn)"/>
    <path d="M30 96Q15 96 24 84L80 9Q85 3 94 3H345L276 96Z" fill="url(#wt)"/>
    <path d="M320 3H400Q439 3 424 23L165 365L45 457Q3 457 13 418L252 95Z" fill="url(#wd)"/>
    <path d="M475 138L605 3V445Q605 457 593 457H487Q475 457 475 445Z" fill="url(#ws)"/>
    <path d="M560 3H605L425 190Q407 198 407 178V160Q407 150 414 142L551 6Q554 3 560 3Z" fill="url(#gf)"/>
    <path d="M100 455C380 462 650 390 715 280C745 230 735 170 650 122L612 108C698 153 722 205 708 255C645 372 390 450 100 455Z" fill="url(#or)"/>
    <circle cx="692" cy="137" r="25" fill="url(#dt)" stroke="#ffffff" stroke-opacity=".85" stroke-width="5"/>
  </g>
</svg>
