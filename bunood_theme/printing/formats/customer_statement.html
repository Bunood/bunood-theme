<!-- Managed by bunood_theme: «كشف حساب - A4» (General Ledger). A report prints through the client-side microtemplates of Frappe; this shell only sends the report filters to bunood_theme.printing.statement.render, which runs the General Ledger on the server (with its permissions) and lays the statement out with the kit macros (templates/print/statement.html). The PDF renders it again on the server from the same filters, never from posted HTML. Microtemplate rules: no line comments, no single quotes outside code. -->
{% var html = ""; frappe.call({ method: "bunood_theme.printing.statement.render", type: "POST", async: false, args: { filters: JSON.stringify(filters || {}) }, callback: function (r) { html = r.message || ""; } }); %}
{%= html %}
