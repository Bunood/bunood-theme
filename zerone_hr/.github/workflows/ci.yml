name: CI

on:
  push:
  pull_request:

jobs:
  rules-and-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest==8.4.2 ruff==0.17.1
      - name: Lint
        run: ruff check zerone_hr tests tools && ruff format --check zerone_hr tests tools
      - name: Saudi rules, day logic, design gates, Arabic coverage
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Front end builds
        working-directory: frontend
        run: yarn install --frozen-lockfile && yarn build
