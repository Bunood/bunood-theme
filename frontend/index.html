<!doctype html>
<html lang="{{ lang or 'en' }}" dir="{{ dir or 'ltr' }}" data-hr-theme="{{ hr_theme or 'frappe-ui' }}" data-theme="{{ theme or 'light' }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title or 'HR' }}</title>
    <!--
      The theme's web sheet and the site's brand sheet (www/people.py::theme_sheets).
      Their order against the app's own stylesheet, which the build appends
      below, decides nothing: the bridge outranks frappe-ui by specificity, and
      the brand sheet's font rule is on body, which nothing of ours sets.
    -->
    {% for href in theme_sheets or [] %}
    <link rel="stylesheet" href="{{ href }}" data-hr-theme-sheet />
    {% endfor %}
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
