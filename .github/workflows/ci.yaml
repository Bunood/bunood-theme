# Static quality gates for every push and PR.
#
# WHAT RUNS HERE vs LOCALLY
#   CI has no bench/site, so it runs the gates that need none:
#     1. the SCSS build — which embeds the RTL guard (the build FAILS on any
#        physical CSS property), so RTL safety is enforced on every push;
#     2. dist drift — the committed compiled output and assets.py must match
#        a fresh build of the committed sources ("forgot to run npm run
#        build" ships stale CSS otherwise, and nothing at runtime would say);
#     3. syntax checks on every shipped JS and Python file.
#   The full browser matrix (tests/smoke.mjs — layouts, presets, rail,
#   preview, save round-trip) needs a running site and is REQUIRED locally
#   before any release tag; see README "Versioning and releases".
name: CI

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: the browser is only needed for the
      # local e2e suite, never for these gates — saves ~120MB per run.
      - name: Install toolchain
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Build (includes the RTL guard)
        run: npm run build

      # `git status --porcelain`, NOT `git diff`: a rebuilt dist file has a
      # new hashed NAME, so the freshly built file is untracked — and `git
      # diff` never reports untracked files. With diff alone, committing via
      # `git commit -am` (which stages the old file's deletion but not the new
      # untracked file) ships a tree with no theme JS at all while CI stays
      # green. Release review v0.6.2..HEAD reproduced that end to end.
      - name: Committed dist matches sources
        run: |
          drift=$(git status --porcelain -- bunood_theme/public/dist bunood_theme/assets.py)
          if [ -n "$drift" ]; then
            echo "$drift"
            echo "::error::dist/assets.py drift — run 'npm run build' and commit ALL of its output (new hashed files included)."
            exit 1
          fi

      # tools/release-review.workflow.js is deliberately absent: it is a
      # Workflow-runtime script (top-level return, runtime globals), not a
      # Node module, and node --check rejects it by design.
      - name: JavaScript syntax
        run: |
          set -e
          for f in build.mjs tests/smoke.mjs bunood_theme/public/js/bunood.js \
                   bunood_theme/bunood_theme/doctype/theme_settings/theme_settings.js; do
            node --check "$f"
          done

      - name: Python syntax
        run: python3 -m compileall -q bunood_theme/

      - name: Upstream migration rejection contracts
        run: python3 tests/test_upstream_gate.py

      # Recomputes every pair the token contract creates, for eight brand seeds
      # in both modes, plus the no-brand-stylesheet fallback — and asserts that
      # _tokens.scss still agrees with palette.derive. Pure stdlib: no site, no
      # database, no Frappe. See GUIDELINES section 2.2.
      - name: Contrast (WCAG 2.2 AA)
        run: npm run contrast
